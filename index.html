<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="數字遊戲">
<meta name="theme-color" content="#e8873a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<title>數字遊戲目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@font-face {
 font-family: "MathsThin";
 src: url("maths_thin_v2.ttf") format("truetype");
 font-display: swap;
}
:root {
 --bg: #f6f3ec;
 --ink: #1f2430;
 --muted: #6b7280;
 --card: #ffffff;
 --line: #e7e1d4;
 --num-font: "MathsThin", "Chakra Petch", "Noto Sans HK", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
 min-height: 100vh;
 background:
   radial-gradient(circle at 12% 8%, #ffe2b8 0, transparent 32%),
   radial-gradient(circle at 92% 18%, #cfe8ff 0, transparent 30%),
   radial-gradient(circle at 70% 95%, #d9f2dc 0, transparent 30%),
   var(--bg);
 color: var(--ink);
 font-family: "Noto Sans HK", system-ui, sans-serif;
 padding: max(24px, env(safe-area-inset-top)) 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; }

header { text-align: center; margin: 12px 0 28px; }
.eyebrow {
 display: inline-block; font-size: 14px; letter-spacing: .12em;
 color: var(--muted); background: rgba(255,255,255,.7);
 border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
}
h1 {
 font-size: clamp(34px, 6vw, 56px); font-weight: 900; margin: 16px 0 6px;
 letter-spacing: .04em;
}
h1 .digits { font-family: var(--num-font); font-weight: 600; color: #e8873a; }
.sub { color: var(--muted); font-size: 18px; margin: 0; }

.filters {
 display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
 margin: 0 0 28px;
}
.filters button {
 font: inherit; font-size: 18px; font-weight: 700;
 min-height: 48px; padding: 0 22px; border-radius: 999px;
 border: 2px solid var(--line); background: var(--card); color: var(--ink);
 cursor: pointer; transition: transform .15s, background .15s, color .15s;
}
.filters button[aria-pressed="true"] {
 background: var(--ink); color: #fff; border-color: var(--ink);
}
.filters button:active { transform: scale(.96); }

.grid {
 display: grid; gap: 20px;
 grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.card {
 --accent: #e8873a; --tint: #fff3e6;
 position: relative; display: flex; flex-direction: column;
 text-decoration: none; color: inherit;
 background: var(--card); border: 2px solid var(--line); border-radius: 26px;
 padding: 22px 22px 20px; overflow: hidden;
 box-shadow: 0 6px 0 var(--line);
 transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
 animation: rise .5s ease both;
}
.card:hover, .card:focus-visible {
 transform: translateY(-4px); border-color: var(--accent);
 box-shadow: 0 10px 0 var(--accent); outline: none;
}
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent); }
.card::after {
 content: ""; position: absolute; right: -40px; top: -40px;
 width: 140px; height: 140px; border-radius: 50%; background: var(--tint);
 z-index: 0;
}
.card > * { position: relative; z-index: 1; }
.icon {
 width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
 background: var(--tint); font-size: 34px; margin-bottom: 16px;
}
.range {
 font-family: var(--num-font); font-size: 40px; line-height: 1;
 color: var(--accent); margin-bottom: 8px; letter-spacing: .02em;
}
.title { font-size: 24px; font-weight: 900; margin: 0 0 6px; }
.desc { font-size: 16px; color: var(--muted); margin: 0 0 18px; line-height: 1.55; flex: 1; }
.go {
 align-self: flex-start; font-weight: 700; font-size: 17px;
 background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 18px;
}
.card.hidden { display: none; }

footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 40px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>數字遊戲 <span class="digits">1–50</span></h1>
 <p class="sub">揀一個遊戲開始吧！</p>
</header>

<nav class="filters" aria-label="篩選">
 <button type="button" data-filter="all" aria-pressed="false">全部</button>
 <button type="button" data-filter="1-10" aria-pressed="false">1–10</button>
 <button type="button" data-filter="11-20" aria-pressed="true">11–20</button>
 <button type="button" data-filter="1-20" aria-pressed="false">1–20</button>
 <button type="button" data-filter="0-31" aria-pressed="false">0–31</button>
 <button type="button" data-filter="cn" aria-pressed="false">中國數字</button>
</nav>

<main class="grid" id="grid"></main>

<footer>2026</footer> 
</div>

<script>
/* ==========================================================
遊戲清單：新增或修改遊戲只需編輯此處
href   ：資料夾請以 "/" 結尾（自動開啟該資料夾的 index.html）
        開頭不要加 "/"，否則會連到網站最頂層
range  ：卡片上顯示的數字範圍
group  ：篩選分類，須與上方篩選按鈕的 data-filter 完全相同
        （"1-10"、"11-20"、"1-20"、"0-31"、"cn"，中間是普通減號 -）
        如想一個遊戲同時出現在幾個分類，可寫成 ["11-20", "1-20"]
========================================================== */
const DEFAULT_FILTER = "11-20";   // 開啟目錄時預設顯示的分類（"all" = 全部）

const GAMES = [
 /* ---------- 1–10 ---------- */
 { href: "ten-frames-same.html",   range: "1–10",  group: "1-10",
   icon: "🔍", title: "十格框找相同數量", desc: "選出點數相同數量的一個。",
   accent: "#e05d7b", tint: "#ffebf0" },

 { href: "ten-frames.html",        range: "1–10",  group: "1-10",
   icon: "⚖️", title: "透過十格框比較數量", desc: "用十格框比較兩組數量。",
   accent: "#f06b3f", tint: "#ffece5" },

 /* ---------- 11–20 ---------- */
 { href: "rcgs-11-20/",            range: "11–20", group: "11-20",
   icon: "🌟", title: "認識數字 11 至 20", desc: "綜合練習，認識 11 至 20。",
   accent: "#d4a017", tint: "#fff8dc" },

 { href: "choosenumber-11-20/",    range: "11–20", group: "11-20",
   icon: "👂", title: "聽數字・揀數字", desc: "聽廣東話讀音，選出正確的數字。",
   accent: "#e8873a", tint: "#fff3e6" },

 { href: "buildnumber-11-20/",     range: "11–20", group: "11-20",
   icon: "🧱", title: "砌數字",       desc: "用十和一砌出聽到的數字。",
   accent: "#2f8fd8", tint: "#e6f3ff" },

 /* ---------- 1–20 ---------- */
 { href: "sequencenumber-1-20/",   range: "1–20",  group: "1-20",
   icon: "➡️", title: "接續數數",     desc: "由一個數字開始接著數，把不見了的數字放回空格。",
   accent: "#8b5cf6", tint: "#f1ebff" },

  { href: "beforeafter-1-20/",      range: "1–20",  group: ["11-20", "1-20"],
   icon: "👉", title: "二十格框：前數和後數", desc: "指着一個數，找出它的前一個數和後一個數。",
   accent: "#db2777", tint: "#fce7f3" },

 
 { href: "twenty-frame_count/",    range: "1–20",  group: "1-20",
   icon: "🔢", title: "二十格框：數出數量", desc: "數一數格框內有多少個圓點。",
   accent: "#3aa76d", tint: "#e7f7ee" },

 { href: "countquantities-1-20/",  range: "1–20",  group: "1-20",
   icon: "👆", title: "二十格框：放出指定數量", desc: "按格子放入或拿走圓點，放出聽到的數量。",
   accent: "#0f9fa8", tint: "#e3f7f8" },

 { href: "comparetwentyframes/",   range: "1–20",  group: "1-20",
   icon: "📊", title: "二十格框：比較數量", desc: "比較兩個二十格框，哪一組較多、較少。",
   accent: "#c26a12", tint: "#fdf0e1" },

 /* ---------- 中國數字（1–50） ---------- */
 { href: "chinese/learn_chinese.html",    range: "一至五十", group: "cn",
  icon: "📖", title: "認識一至五十",   desc: "認識阿拉伯數字與中國數字。",
   accent: "#B45309", tint: "#FDEBD3" },
   { href: "chinese/arabic_chinese_matching.html",    range: "一至五十", group: "cn",
   icon: "🃏", title: "中國數字翻牌",   desc: "翻開兩張牌，把 7 和「七」配成一對。",
   accent: "#B45309", tint: "#FDEBD3" },

 { href: "chinese/link_chinese.html",    range: "一至五十", group: "cn",
   icon: "🔗", title: "中國數字連線",   desc: "把阿拉伯數字和相同的中國數字連起來。",
   accent: "#0f766e", tint: "#ccfbf1" },

 { href: "chinese/write_chinese.html",    range: "一至五十", group: "cn",
   icon: "🖌️", title: "寫中國數字",     desc: "跟筆順在田字格寫一至五十。",
   accent: "#c2410c", tint: "#ffedd5" },

 { href: "chinese/read_chinese.html",     range: "一至五十", group: "cn",
   icon: "🗣️", title: "讀中國數字",     desc: "聽讀音揀字，或用閃卡一起朗讀。",
   accent: "#be185d", tint: "#fce7f3" },

 { href: "chinese/build_chinese.html",    range: "一至五十", group: "cn",
   icon: "🧩", title: "砌中國數字",     desc: "用「二」「十」「三」等字卡砌出數字。",
   accent: "#7c3aed", tint: "#ede9fe" },

 { href: "chinese/find_chinese.html",    range: "一至五十", group: "cn",
   icon: "🔨", title: "中國數字打地鼠", desc: "敲中舉著正確中國數字的地鼠。",
   accent: "#4d7c0f", tint: "#ecfccb" },

 { href: "chinese/chinese_sequence.html",    range: "一至五十", group: "cn",
   icon: "🔀", title: "中國數字排序",   desc: "由小至大排好，或填回不見了的數字。",
   accent: "#0369a1", tint: "#e0f2fe" },

 { href: "chinese/chinese_date.html", range: "日期",     group: "cn",
   icon: "📅", title: "月曆讀日期",     desc: "在月曆上讀日期、找日期、說出星期幾。",
   accent: "#b91c1c", tint: "#fee2e2" },

 /* ---------- 0–31 ---------- */
 { href: "writenumber-1-20/",      range: "0–31",  group: "0-31",
   icon: "✏️", title: "寫數字",       desc: "跟筆順描寫或聽寫 0 至 31。",
   accent: "#2b5fd9", tint: "#e8eefc" },
];

const grid = document.getElementById("grid");
GAMES.forEach((g, i) => {
const a = document.createElement("a");
a.className = "card";
a.href = g.href;
a.dataset.group = [].concat(g.group).join(" ");
a.style.setProperty("--accent", g.accent);
a.style.setProperty("--tint", g.tint);
a.style.animationDelay = (i * 60) + "ms";
a.innerHTML = `
 <div class="icon" aria-hidden="true">${g.icon}</div>
 <div class="range">${g.range}</div>
 <h2 class="title">${g.title}</h2>
 <p class="desc">${g.desc}</p>
 <span class="go">開始 ▶</span>`;
grid.appendChild(a);
});

function applyFilter(f){
 document.querySelectorAll(".filters button")
   .forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === f)));
 document.querySelectorAll(".card").forEach(c => {
   c.classList.toggle("hidden", f !== "all" && !c.dataset.group.split(" ").includes(f));
 });
}
document.querySelectorAll(".filters button").forEach(btn => {
 btn.addEventListener("click", () => applyFilter(btn.dataset.filter));
});
applyFilter(DEFAULT_FILTER);

/* PWA：離線快取（共用根目錄的 sw.js） */
if ("serviceWorker" in navigator && location.protocol !== "file:")
 navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
</script>
</body>
</html>
