<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>11至20・聽廣東話讀數字</title><style>
:root{--ink:#173d47;--teal:#008f9a;--paper:#f0fafb;--gold:#ffe263}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Microsoft JhengHei',sans-serif}main{max-width:1150px;margin:auto;padding:28px 24px 40px}h1{font-size:clamp(25px,4vw,40px);margin:0 0 10px}p{line-height:1.6}.intro{margin:0 0 24px;font-size:20px}.stage{text-align:center;background:white;border-radius:24px;padding:22px;border:2px solid #d1e9ec}.place{display:flex;justify-content:center;gap:24px}.column{width:145px}.label{display:block;font-size:21px;margin-bottom:12px}.digit{display:grid;place-items:center;background:#e3f5f5;border:3px solid #b0dfe3;border-radius:20px;font-size:clamp(80px,14vw,128px);font-weight:750;line-height:1.2;min-height:160px;transition:background .1s,box-shadow .1s}.lit{background:var(--gold)!important;border-color:#e2a900!important;box-shadow:0 0 0 7px #ffe26366,0 0 32px #ffda51;color:#493100}.reading{min-height:60px;font-size:36px;font-weight:700;margin:20px 0 6px}.syllable{display:inline-block;min-width:56px;padding:4px 12px;border-radius:12px}.active-word{background:var(--gold);color:#493100}.status{min-height:30px;font-size:18px;margin:8px 0}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:24px 0}button{font:inherit;cursor:pointer;touch-action:manipulation;color:var(--ink)}.number{border:2px solid #9bd9de;background:white;border-radius:17px;padding:16px 6px;font-size:clamp(34px,6vw,56px);font-weight:750}.number.chosen{border-color:var(--teal);background:#d7f4f5;box-shadow:0 0 0 2px var(--teal)}button:focus-visible,select:focus-visible{outline:4px solid #ce8c00;outline-offset:4px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:15px}.controls button{border:0;border-radius:12px;background:var(--teal);color:white;padding:12px 18px;font-size:19px}.controls button.stop{background:#5b6e74}select{font:inherit;max-width:100%;padding:9px;border:1px solid #9fc6ca;border-radius:8px;background:white}.settings{margin-top:24px;display:flex;flex-wrap:wrap;gap:15px;align-items:center;font-size:17px}.help{font-size:17px;color:#43636c}.error{color:#a23320;font-weight:600}@media(max-width:500px){main{padding:20px 14px}.numbers{gap:8px}.number{padding:15px 3px}.column{width:120px}.digit{min-height:135px}.place{gap:18px}.intro{font-size:18px}}
</style></head><body><main><h1>11至20：聽廣東話讀數字</h1><p class="intro">按一個數字，聽讀音，看看哪個數位亮起。</p><section class="stage" aria-label="讀音示範"><div class="place"><div class="column"><span class="label">十位</span><span class="digit" id="tens">1</span></div><div class="column"><span class="label">個位</span><span class="digit" id="units">1</span></div></div><div class="reading" id="reading" aria-label="十一"></div><p id="status" class="status" role="status" aria-live="polite">按下面的數字開始。</p><div class="controls"><button id="repeat">再聽一次</button><button id="all">順序讀11至20</button><button id="stop" class="stop">停止</button></div></section><div class="numbers" id="numbers" aria-label="11至20數字選擇"></div><div class="settings"><label>廣東話聲音 <select id="voice" aria-label="廣東話聲音"></select></label><label>讀音速度 <select id="speed"><option value="0.65">慢</option><option value="0.85" selected>普通</option><option value="1">快</option></select></label></div><p class="help">11讀「十、一」：先亮十位的1，再亮個位的1。<br>20讀「二、十」：兩段都亮十位的2；個位的0不讀出。</p><p class="help">聲音使用裝置的廣東話語音。若未找到聲音，請先在裝置下載廣東話語音，再用Safari或Chrome開啟本頁。</p></main><script>
'use strict';
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
const words=['','一','二','三','四','五','六','七','八','九'];
const plan=n=>n===20?[{word:'二',place:'tens'},{word:'十',place:'tens'}]:[{word:'十',place:'tens'},{word:words[n-10],place:'units'}];
let current=11,token=0,timer=0,watchdog=0,utterance=null,voices=[],fallback=false;
function clearLight(){['tens','units'].forEach(id=>$(id).classList.remove('lit'));document.querySelectorAll('.syllable').forEach(e=>e.classList.remove('active-word'));}
function halt(){token++;clearTimeout(timer);clearTimeout(watchdog);if(synth&&(synth.speaking||synth.pending))synth.cancel();utterance=null;clearLight();$('all').textContent='順序讀11至20';}
function show(n){current=n;$('tens').textContent=String(n)[0];$('units').textContent=String(n)[1];$('reading').replaceChildren();for(const item of plan(n)){let e=document.createElement('span');e.className='syllable';e.textContent=item.word;$('reading').append(e);}$('reading').setAttribute('aria-label',plan(n).map(x=>x.word).join(''));document.querySelectorAll('.number').forEach(e=>{let selected=Number(e.dataset.number)===n;e.classList.toggle('chosen',selected);e.setAttribute('aria-pressed',String(selected));});}
function error(message){clearLight();$('status').textContent=message;$('status').classList.add('error');}
function refreshVoices(){if(!synth){error('此瀏覽器未支援語音播放，請用Safari或Chrome開啟。');return;}let old=$('voice').value;voices=synth.getVoices().filter(v=>/^yue(?:[-_]|$)/i.test(v.lang)||/^zh[-_](HK|Hant[-_]HK)/i.test(v.lang)||/cantonese|廣東話|粤语|粵語/i.test(v.name));$('voice').replaceChildren();voices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+' ('+v.lang+')';$('voice').append(o);});if(voices.length){fallback=false;if(voices[Number(old)])$('voice').value=old;$('status').classList.remove('error');if(!utterance)$('status').textContent='廣東話聲音已準備好。按數字開始。';}else{let o=document.createElement('option');o.textContent='未找到廣東話聲音';o.value='';$('voice').append(o);fallback=true;$('status').classList.remove('error');$('status').textContent='未找到指定的廣東話聲音，將嘗試使用系統預設語音。如沒有聲音，請在裝置下載廣東話語音。';}}
function read(n,all=false){const busy=!!(synth&&(synth.speaking||synth.pending));halt();show(n);const run=token;if(!synth)return error('此瀏覽器未支援語音播放。');if(!voices.length)refreshVoices();const voice=voices[Number($('voice').value)]||voices[0]||null;$('status').classList.remove('error');$('status').textContent='準備播放…';if(all)$('all').textContent='正在順序讀…';const parts=plan(n);let index=0;
function next(){if(run!==token)return;clearLight();if(index===parts.length){utterance=null;$('status').textContent=n===20?'二十：個位的0不讀出。':'讀完了。你也讀一次。';if(all&&n<20)timer=setTimeout(()=>read(n+1,true),850);else $('all').textContent='順序讀11至20';return;}const part=parts[index],wordIndex=index;index++;const u=new SpeechSynthesisUtterance(part.word);utterance=u;if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang='zh-HK';u.rate=Number($('speed').value);u.pitch=1;u.volume=1;let started=false,settled=false;
u.onstart=()=>{if(run!==token)return;started=true;clearTimeout(watchdog);$(part.place).classList.add('lit');$('reading').children[wordIndex].classList.add('active-word');$('status').textContent='讀「'+part.word+'」';watchdog=setTimeout(()=>{if(run===token){halt();error('播放未能完成，請再按一次數字。');}},12000);};
u.onend=()=>{if(run!==token||settled)return;settled=true;clearTimeout(watchdog);clearLight();timer=setTimeout(next,160);};
u.onerror=()=>{if(run!==token||settled)return;settled=true;halt();error('聲音播放失敗。請檢查裝置的廣東話語音，再按一次數字。');};
watchdog=setTimeout(()=>{if(run===token&&!started){halt();error('聲音未能開始。請檢查廣東話語音及裝置音量，再按一次。');}},8000);if(synth.paused)synth.resume();synth.speak(u);}
if(busy)timer=setTimeout(next,120);else next();}
for(let n=11;n<=20;n++){let b=document.createElement('button');b.type='button';b.className='number';b.dataset.number=String(n);b.textContent=String(n);b.setAttribute('aria-label','播放'+plan(n).map(x=>x.word).join('')+'的廣東話讀音');b.addEventListener('click',()=>read(n));$('numbers').append(b);}
$('repeat').addEventListener('click',()=>read(current));$('all').addEventListener('click',()=>read(11,true));$('stop').addEventListener('click',()=>{halt();$('status').textContent='已停止。按數字再聽。';});$('voice').addEventListener('change',()=>halt());$('speed').addEventListener('change',()=>halt());document.addEventListener('visibilitychange',()=>{if(document.hidden)halt();});window.addEventListener('pagehide',halt);if(synth)synth.addEventListener('voiceschanged',refreshVoices);show(11);refreshVoices();
</script></body></html>
