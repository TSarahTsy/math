<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二十格框：數字配對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 自訂數字字體 =====
  字體檔與本 HTML 放在同一資料夾；若找不到，會自動改用 Chakra Petch。 */
@font-face{
 font-family:"MyNumberFont";
 src:url("maths_thin_v2.ttf") format("truetype");
 font-display:swap;
}
:root{
 --num-font:"MyNumberFont","Chakra Petch","Noto Sans HK",system-ui,sans-serif;
 --bg:#F3F7FB; --panel:#FFFFFF; --ink:#111821; --muted:#5A6B82;
 --cyan:#0A9DB8; --purple:#6B4EE0; --amber:#D48A00; --mint:#12A574; --red:#D14A4A;
 --line:rgba(17,24,33,.14);
 --counter:#FFD84D; --counter-ink:#111821;
 --tile:clamp(52px,13vw,82px);
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
   --bg:#08111F; --panel:#0F1D33; --ink:#E6F3FF; --muted:#8BA3C2;
   --cyan:#3DE0F5; --purple:#A58BFF; --amber:#FFC14D; --mint:#5CF2B0; --red:#FF7A7A;
   --line:rgba(61,224,245,.2);
 }
}
:root[data-theme="dark"]{
 --bg:#08111F; --panel:#0F1D33; --ink:#E6F3FF; --muted:#8BA3C2;
 --cyan:#3DE0F5; --purple:#A58BFF; --amber:#FFC14D; --mint:#5CF2B0; --red:#FF7A7A;
 --line:rgba(61,224,245,.2);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
 min-height:100%;margin:0;background:var(--bg);color:var(--ink);
 font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
 -webkit-tap-highlight-color:transparent;
}
body.dragging{overflow:hidden;cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

.app{max-width:860px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:clamp(18px,4.6vw,24px);font-weight:900;flex:1}
.progress{font-size:16px;font-weight:700;color:var(--muted);white-space:nowrap}
.progress b{font-family:var(--num-font);font-weight:400;font-size:22px;color:var(--ink)}
.gear{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;flex-shrink:0}

/* 二十格框 */
.board{
 position:relative;margin:0 auto;
 width:min(100%, calc((100vh - 250px) * 1.28));
 width:min(100%, calc((100svh - 250px) * 1.28));
 min-width:min(100%, 320px);
}
.board img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.zone{
 position:absolute;padding:0;border:0;background:transparent;border-radius:3px;
 container-type:size;transition:box-shadow .12s,background .12s;
}
.zone.hover{box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 7px var(--purple)}
.zone.bad{background:rgba(209,74,74,.4);animation:shake .35s}
.zone .placed{
 position:absolute;left:8%;top:8%;width:56%;aspect-ratio:1;border-radius:14%;
 background:var(--counter);color:var(--counter-ink);border:2px solid var(--counter-ink);
 display:grid;place-items:center;font-family:var(--num-font);font-weight:400;
 font-size:22px;font-size:30cqmin;line-height:1;animation:pop .28s ease-out;
}
@keyframes pop{from{transform:scale(.6)}70%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* 數字托盤 */
.tray-wrap{display:flex;flex-direction:column;gap:6px}
.hint{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.tray{
 display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;
 padding:14px;border-radius:20px;background:var(--panel);border:1.5px solid var(--line);
 min-height:calc(var(--tile) + 32px);
}
.tile{
 width:var(--tile);aspect-ratio:1;border-radius:16px;padding:0;
 background:var(--counter);color:var(--counter-ink);border:3px solid var(--counter-ink);
 box-shadow:0 4px 0 var(--counter-ink);
 font-family:var(--num-font);font-weight:400;font-size:calc(var(--tile) * .5);line-height:1;
 display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
}
.tile.selected{outline:4px solid var(--purple);outline-offset:3px;transform:translateY(-4px)}
.tile.ghost{opacity:.25}
.tile.floating{position:fixed;margin:0;z-index:20;pointer-events:none;box-shadow:0 12px 24px rgba(0,0,0,.28);transition:none}
.tile.returning{transition:transform .2s ease-out}

.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:30;
 padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}
.screen h1{margin:0;font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:.03em}
.screen p{margin:0;max-width:30em;color:var(--muted);line-height:1.7}
.screen img{width:min(70vw,360px);height:auto}
.note{font-size:14px;color:var(--amber)!important}
.big-btn{min-width:200px;padding:16px 28px;border-radius:999px;border:none;background:var(--cyan);color:var(--bg);font-size:22px;font-weight:900}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1.5px solid var(--line);border-radius:22px 22px 0 0;
 padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.sheet h2{margin:0 0 12px;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-width:56px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.sheet .big-btn{width:100%;margin-top:16px}

@media (prefers-reduced-motion:reduce){
 .zone .placed,.zone.bad{animation:none}
 .tile.returning,.sheet{transition:none}
}
</style>
</head>

}
/* 固定使用的聲音：iPad 用 Sinji，Windows 用 Microsoft Danny。
  兩者都找不到時，才使用之前選擇的聲音或清單中的第一個。 */
const PREFERRED_VOICES = [/^Sinji\b/i, /Microsoft Danny/i];
function pickVoice(){
 const vs = cantoneseVoices();
 for (const re of PREFERRED_VOICES){ const v = vs.find(x => re.test(x.name)); if (v) return v; }
 let saved = '';
 try { saved = localStorage.getItem('rcgs-cantonese-voice') || ''; } catch(e){}
 return vs.find(v => v.name === saved) || vs[0] || null;
}
function refreshVoice(){
 if (!hasSpeech) return;
 voice = pickVoice();
 $('voiceNote').hidden = !!voice;
 if (!voice) $('voiceNote').textContent = '此裝置未找到粵語語音，將嘗試使用系統預設語音。';
}
if (hasSpeech){ refreshVoice(); synth.addEventListener('voiceschanged', refreshVoice); }
function speak(text){
 if (!hasSpeech || settings.voice === 'off') return;
 clearTimeout(speakDelay);
 const busy = synth.speaking || synth.pending;
 if (busy) synth.cancel();
 const go = () => {
   const u = new SpeechSynthesisUtterance(text);
   if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'zh-HK';
   u.rate = .85; window._u = u;
   if (synth.paused) synth.resume();
   synth.speak(u);
 };
 busy ? (speakDelay = setTimeout(go, 120)) : go();
}

/* ---------- 聲效 ----------
  以程式合成 WAV，再用 <audio> 播放。
  iPad／iPhone 的靜音模式會令 Web Audio 無聲，但 <audio> 播放不受影響。 */
const SR = 22050;
const SOUNDS = {
 tap:     { len:.12, notes:[[620,0,.07,'sine',.25]] },
 correct: { len:.8,  notes:[[523.25,0,.22,'tri',.4],[659.25,.09,.22,'tri',.4],[783.99,.18,.22,'tri',.4],
                            [1046.5,.27,.45,'tri',.45],[2093,.3,.4,'sine',.12],[1567.98,.36,.35,'sine',.1]] },
 wrong:   { len:.55, notes:[[330,0,.18,'tri',.45,300],[247,.2,.3,'tri',.45,196]] },
 finish:  { len:1.4, notes:[[523.25,0,.3,'tri',.38],[659.25,.12,.3,'tri',.38],[783.99,.24,.3,'tri',.38],[1046.5,.36,.5,'tri',.4],
                            [1046.5,.5,.8,'sine',.1],[1318.5,.5,.8,'sine',.1],[1567.98,.5,.8,'sine',.1]] }
};
function renderWav({ len, notes }){
 const n = Math.ceil(len * SR), buf = new Float32Array(n);
 for (const [f, at, dur, type, vol, glide] of notes){
   const s0 = Math.floor(at * SR), sN = Math.floor(dur * SR), atk = .015;
   let ph = 0;
   for (let i = 0; i < sN && s0 + i < n; i++){
     const t = i / SR, fr = glide ? f * Math.pow(glide / f, t / dur) : f;
     ph += 2 * Math.PI * fr / SR;
     const w = type === 'sine' ? Math.sin(ph) : (2 / Math.PI) * Math.asin(Math.sin(ph));
     const env = t < atk ? t / atk : Math.pow(1 - (t - atk) / (dur - atk), 2);
     buf[s0 + i] += w * env * vol;
   }
 }
 const out = new DataView(new ArrayBuffer(44 + n * 2));
 const str = (o, x) => [...x].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
 str(0,'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8,'WAVE'); str(12,'fmt ');
 out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
 out.setUint32(24,SR,true); out.setUint32(28,SR*2,true); out.setUint16(32,2,true); out.setUint16(34,16,true);
 str(36,'data'); out.setUint32(40, n * 2, true);
 for (let i = 0; i < n; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, buf[i])) * 32767, true);
 return URL.createObjectURL(new Blob([out], { type:'audio/wav' }));
}
const players = {};
for (const k in SOUNDS){ const a = new Audio(renderWav(SOUNDS[k])); a.preload = 'auto'; players[k] = a; }
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}

let audioUnlocked = false;
function ensureAudio(){ // 須在使用者按鍵時呼叫一次，以解鎖 iOS 的播放限制
 if (audioUnlocked) return; audioUnlocked = true;
 Object.values(players).forEach(a => {
   a.muted = true;
   const p = a.play();
   const reset = () => { a.pause(); a.currentTime = 0; a.muted = false; };
   p && p.then ? p.then(reset).catch(() => { a.muted = false; audioUnlocked = false; }) : reset();
 });
}
function playSfx(k){
 if (settings.sfx === 'off') return;
 const a = players[k]; if (!a) return;
 try { a.muted = false; a.currentTime = 0; const p = a.play(); p && p.catch && p.catch(() => {}); } catch(e){}
}
const sfx = { tap:() => playSfx('tap'), correct:() => playSfx('correct'), wrong:() => playSfx('wrong'), finish:() => playSfx('finish') };


/* ---------- 遊戲 ---------- */
const board = $('board'), tray = $('tray');
const zones = CELLS.map(([x, y, w, h], i) => {
 const z = document.createElement('button');
 z.className = 'zone'; z.dataset.n = i + 1;
 z.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
 z.setAttribute('aria-label', '第 ' + (i + 1) + ' 格');
 z.addEventListener('click', () => onZoneTap(z));
 board.appendChild(z);
 return z;
});

const state = { queue:[], tray:[], placed:new Set(), selected:null, locked:false };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function newGame(){
 const nums = Array.from({ length:20 }, (_, i) => i + 1);
 state.queue = settings.order === 'rand' ? shuffle(nums) : nums;
 state.tray = []; state.placed = new Set(); state.selected = null; state.locked = false;
 zones.forEach(z => { z.classList.remove('filled', 'hover', 'bad'); z.innerHTML = ''; });
 fillTray(); renderTray(); updateProgress();
}
function fillTray(){
 const max = Number(settings.batch);
 while (state.tray.length < max && state.queue.length) state.tray.push(state.queue.shift());
}
function renderTray(){
 tray.innerHTML = '';
 state.tray.forEach(n => {
   const t = document.createElement('button');
   t.className = 'tile' + (state.selected === n ? ' selected' : '');
   t.textContent = n; t.dataset.n = n;
   t.setAttribute('aria-label', '數字 ' + n);
   t.addEventListener('pointerdown', onPointerDown);
   t.addEventListener('click', e => { if (e.detail === 0) select(n); }); // 鍵盤操作
   tray.appendChild(t);
 });
}
function updateProgress(){ $('done').textContent = state.placed.size; }

function select(n){
 state.selected = state.selected === n ? null : n;
 renderTray();
 if (state.selected !== null) speak(toCN(n));
}
function onZoneTap(z){
 if (state.locked) return;
 ensureAudio();
 if (state.selected !== null){ attempt(state.selected, z); return; }
 speak(toCN(Number(z.dataset.n))); // 未選數字時，按格子可聽該格的讀音
}

/* 放入格子：成功回傳 true */
function attempt(n, z){
 const target = Number(z.dataset.n);
 if (state.placed.has(target)) return false;
 if (target === n){ place(n, z); return true; }
 z.classList.remove('bad'); void z.offsetWidth; z.classList.add('bad');
 setTimeout(() => z.classList.remove('bad'), 600);
 sfx.wrong();
 return false;
}
function place(n, z){
 state.placed.add(n);
 state.tray = state.tray.filter(x => x !== n);
 if (state.selected === n) state.selected = null;
 z.classList.add('filled');
 z.innerHTML = `<span class="placed" aria-hidden="true">${n}</span>`;
 z.setAttribute('aria-label', '第 ' + n + ' 格，已放好');
 sfx.correct();
 setTimeout(() => speak(toCN(n)), 550);
 fillTray(); renderTray(); updateProgress();
 if (state.placed.size === 20){
   state.locked = true;
   setTimeout(() => {
     $('endMsg').textContent = '二十個數字都放回正確的格子了，做得好！';
     $('endScreen').hidden = false;
     sfx.finish();
     setTimeout(() => speak('做得好'), 900);
   }, 1300);
 }
}

/* ---------- 拖放（同時支援手指及滑鼠） ---------- */
let drag = null;
function zoneAt(x, y){
 return zones.find(z => {
   if (state.placed.has(Number(z.dataset.n))) return false;
   const r = z.getBoundingClientRect();
   return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
 }) || null;
}
function onPointerDown(e){
 if (state.locked || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
 ensureAudio();
 e.preventDefault();
 const tile = e.currentTarget;
 drag = { n:Number(tile.dataset.n), tile, id:e.pointerId, sx:e.clientX, sy:e.clientY, moved:false, clone:null, hover:null };
}
window.addEventListener('pointermove', e => {
 if (!drag || e.pointerId !== drag.id) return;
 const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
 if (!drag.moved){
   if (Math.hypot(dx, dy) < 8) return;
   drag.moved = true;
   const r = drag.tile.getBoundingClientRect();
   const c = drag.tile.cloneNode(true);
   c.classList.remove('selected'); c.classList.add('floating');
   c.style.left = r.left + 'px'; c.style.top = r.top + 'px'; c.style.width = r.width + 'px';
   document.body.appendChild(c);
   drag.clone = c;
   drag.tile.classList.add('ghost');
   document.body.classList.add('dragging');
 }
 e.preventDefault();
 drag.clone.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`;
 const z = zoneAt(e.clientX, e.clientY);
 if (z !== drag.hover){
   drag.hover && drag.hover.classList.remove('hover');
   z && z.classList.add('hover');
   drag.hover = z;
 }
}, { passive:false });

function endDrag(e, cancelled){
 if (!drag || e.pointerId !== drag.id) return;
 const d = drag; drag = null;
 document.body.classList.remove('dragging');
 d.hover && d.hover.classList.remove('hover');
 if (!d.moved){ if (!cancelled) select(d.n); return; }
 const z = cancelled ? null : zoneAt(e.clientX, e.clientY);
 if (z && attempt(d.n, z)){ d.clone.remove(); return; }
 // 放錯或放在格外：數字飛回托盤
 const c = d.clone;
 c.classList.add('returning');
 requestAnimationFrame(() => { c.style.transform = 'translate(0,0) scale(1)'; });
 setTimeout(() => { c.remove(); d.tile.classList.remove('ghost'); }, 220);
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------- 介面事件 ---------- */
$('startBtn').onclick = () => {
 ensureAudio();
 if (hasSpeech){ refreshVoice(); synth.speak(new SpeechSynthesisUtterance('')); } // 解鎖 iOS 語音
 $('startScreen').hidden = true; newGame();
};
$('againBtn').onclick = () => { ensureAudio(); $('endScreen').hidden = true; newGame(); };

function syncSeg(){
 document.querySelectorAll('.seg').forEach(seg => {
   seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.val === String(settings[seg.dataset.key]))));
 });
}
document.querySelectorAll('.seg').forEach(seg => {
 seg.addEventListener('click', e => {
   const b = e.target.closest('button'); if (!b) return;
   settings[seg.dataset.key] = b.dataset.val; syncSeg();
 });
});
$('gearBtn').onclick = () => { syncSeg(); $('sheet').classList.toggle('open'); };
$('applyBtn').onclick = () => {
 try { localStorage.setItem('rcgs-twenty-frame', JSON.stringify(settings)); } catch(e){}
 $('sheet').classList.remove('open');
 $('endScreen').hidden = true;
 if ($('startScreen').hidden) newGame();
};
syncSeg();
</script>
</body>
</html>
