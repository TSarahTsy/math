<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>透過十格框比較數量</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
 :root{
   --cream:#FBF6E9;
   --cream-2:#F4EDD8;
   --ink:#2E2B24;
   --ink-soft:#5B564A;
   --teal:#2E8F8A;
   --teal-deep:#1F6A66;
   --coral:#E9814A;
   --coral-deep:#C85E2A;
   --frame-bg:#FCEBA6;
   --frame-border:#2E2B24;
   --paired:#8FAF7E;
--amber:#8BC34A;   /* 淺綠 */
--orange:#4CAF50;  /* 中綠 */
--red:#2E7D32;
   --card-shadow: 0 10px 24px rgba(46,43,36,0.10);
   box-sizing:border-box;
   padding-top: env(safe-area-inset-top, 0px);
   padding-bottom: env(safe-area-inset-bottom, 0px);
 }
 @media (prefers-color-scheme: dark){
   :root:not([data-theme="light"]){
     --cream:#20231F;
     --cream-2:#262A24;
     --ink:#F1EEE3;
     --ink-soft:#C9C4B4;
     --frame-bg:#4A431F;
     --frame-border:#EDE7D0;
     --card-shadow: 0 10px 24px rgba(0,0,0,0.35);
   }
 }
 :root[data-theme="dark"]{
   --cream:#20231F;
   --cream-2:#262A24;
   --ink:#F1EEE3;
   --ink-soft:#C9C4B4;
   --frame-bg:#4A431F;
   --frame-border:#EDE7D0;
   --card-shadow: 0 10px 24px rgba(0,0,0,0.35);
 }
 html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
 *{ box-sizing:border-box; }
 body{
   margin:0;
   min-height:100%;
   background:var(--cream);
   color:var(--ink);
   font-family:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
   -webkit-font-smoothing:antialiased;
 }

 #app{
   max-width:1180px;
   margin:0 auto;
   padding:28px 20px 60px;
 }

 header{
   text-align:center;
   margin-bottom:22px;
 }
 header h1{
   font-size:clamp(1.5rem, 3.2vw, 2.2rem);
   font-weight:900;
   letter-spacing:0.02em;
   margin:0 0 6px;
   color:var(--teal-deep);
 }
 header p{
   margin:0;
   color:var(--ink-soft);
   font-size:0.98rem;
   line-height:1.6;
 }

 .controls{
   display:flex;
   flex-wrap:wrap;
   gap:14px;
   align-items:flex-end;
   justify-content:center;
   background:var(--cream-2);
   border-radius:18px;
   padding:16px 18px;
   margin-bottom:26px;
   box-shadow: var(--card-shadow);
 }
 .field{
   display:flex;
   flex-direction:column;
   gap:6px;
 }
 .field label{
   font-size:0.82rem;
   font-weight:700;
   color:var(--ink-soft);
 }
 .field input{
   width:84px;
   font-size:1.15rem;
   font-weight:700;
   text-align:center;
   padding:8px 6px;
   border-radius:10px;
   border:2px solid #D8D0B4;
   background:#fff;
   color:var(--ink);
   font-family:inherit;
 }
 .field input:focus{
   outline:3px solid var(--teal);
   outline-offset:1px;
 }
 button{
   font-family:inherit;
   cursor:pointer;
   border:none;
   border-radius:12px;
   font-weight:700;
   font-size:0.95rem;
   padding:11px 20px;
   transition:transform .12s ease, box-shadow .12s ease;
 }
 button:active{ transform:translateY(1px); }
 button:focus-visible{ outline:3px solid var(--teal-deep); outline-offset:2px; }
 #startBtn{
   background:var(--teal);
   color:#fff;
   box-shadow:0 6px 14px rgba(46,143,138,0.32);
 }
 #startBtn:hover{ background:var(--teal-deep); }
 #randomBtn{
   background:#fff;
   color:var(--teal-deep);
   border:2px solid var(--teal);
 }
 #randomBtn:hover{ background:#EAF6F5; }
 #muteBtn{
   background:#fff;
   color:var(--ink-soft);
   border:2px solid #D8D0B4;
 }
 #muteBtn:hover{ background:var(--cream-2); }
 #muteBtn[aria-pressed="true"]{
   color:var(--coral-deep);
   border-color:var(--coral);
 }

 .stage{
   display:flex;
   gap:24px;
   align-items:stretch;
 }
 .frames{
   flex:1;
   position:relative;
   background:#fff;
   border-radius:22px;
   padding:26px 22px 22px;
   box-shadow:var(--card-shadow);
   display:flex;
   flex-direction:column;
   gap:16px;
 }
 .frame-block{
   display:flex;
   flex-direction:column;
   align-items:center;
   gap:8px;
   transition: transform .18s ease;
 }
 .frame-block.shake{ animation: shake .38s ease; }
 @keyframes shake{
   0%,100%{ transform:translateX(0); }
   20%{ transform:translateX(-6px); }
   40%{ transform:translateX(6px); }
   60%{ transform:translateX(-4px); }
   80%{ transform:translateX(4px); }
 }
 .frame-label{
   font-size:0.88rem;
   font-weight:700;
   color:var(--ink-soft);
   letter-spacing:0.04em;
 }
 .tenframe{
   display:grid;
   grid-template-columns:repeat(5,1fr);
   grid-template-rows:repeat(2,1fr);
   width:min(100%, 480px);
   aspect-ratio:5/2;
   background:var(--frame-bg);
   border:3px solid var(--frame-border);
   border-radius:16px;
   overflow:hidden;
 }
 .cell{
   position:relative;
   display:flex;
   align-items:center;
   justify-content:center;
   border-right:2px solid var(--frame-border);
   border-bottom:2px solid var(--frame-border);
 }
 .cell:nth-child(5n){ border-right:none; }
 .cell:nth-child(n+6){ border-bottom:none; }

 .dot{
   width:64%;
   height:64%;
   border-radius:50%;
   border:none;
   display:flex;
   align-items:center;
   justify-content:center;
   box-shadow:0 3px 0 rgba(0,0,0,0.18);
   transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease, filter .2s ease;
 }
 .dot--top{ background:var(--teal); }
 .dot--bottom{ background:var(--coral); }
 .dot:not(:disabled):hover{ transform:scale(1.08); }
 .dot:not(:disabled):focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }

 .dot.selected{
   box-shadow:0 0 0 5px rgba(46,43,36,0.16), 0 3px 0 rgba(0,0,0,0.18);
   transform:scale(1.1);
 }
 .dot.paired{
   background:var(--paired) !important;
   opacity:0.9;
 }
 .dot.paired::after{
   content:'✓';
   color:#fff;
   font-weight:900;
   font-size:0.9rem;
 }
 .dot.leftover{
   background:var(--orange) !important;
   animation:pulseLeftover .5s ease;
 }
 @keyframes pulseLeftover{
   0%{ transform:scale(1); }
   40%{ transform:scale(1.25); }
   100%{ transform:scale(1); }
 }

 .dot.next{
   animation:nextGlow 1.1s ease-in-out infinite;
 }
 @keyframes nextGlow{
   0%,100%{ box-shadow:0 0 0 0 rgba(46,43,36,0.28), 0 3px 0 rgba(0,0,0,0.18); }
   50%{ box-shadow:0 0 0 6px rgba(46,43,36,0), 0 3px 0 rgba(0,0,0,0.18); }
 }

 .status-bar{
   text-align:center;
   font-size:0.95rem;
   font-weight:700;
   color:var(--teal-deep);
   min-height:1.4em;
   padding:2px 10px;
 }
 .status-bar.warn{ color:var(--red); }

 .side-panel{
   width:150px;
   flex-shrink:0;
   display:flex;
   flex-direction:column;
   align-items:center;
   justify-content:center;
   gap:10px;
   overflow:visible;
 }
 .duo-wrap{
   width:100%;
   height:180px;
   display:flex;
   align-items:center;
   justify-content:center;
   overflow:visible;
 }
 .duo-char{
   display:inline-block;
   font-size:2.6rem;
   font-weight:900;
   color:var(--amber);
   transform:scale(0);
   opacity:0;
   transition:opacity .25s ease, color .25s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
 }
 .duo-char.show{ opacity:1; }
 .duo-char.pop{ animation:duoPop .35s cubic-bezier(.34,1.56,.64,1); }
 @keyframes duoPop{
   0%{ filter:brightness(1); }
   50%{ filter:brightness(1.25); }
   100%{ filter:brightness(1); }
 }
 .duo-char.lvl2{ color:var(--orange); }
 .duo-char.lvl3{ color:var(--red); }

 .duo-count{
   font-size:0.86rem;
   font-weight:700;
   color:var(--ink-soft);
   text-align:center;
   min-height:2.4em;
 }

 .result{
   margin-top:24px;
   background:var(--cream-2);
   border-radius:18px;
   padding:20px 22px;
   text-align:center;
   box-shadow:var(--card-shadow);
   font-size:1.05rem;
   font-weight:700;
   color:var(--teal-deep);
 }
 .result .big{
   font-size:1.35rem;
   color:var(--coral-deep);
 }

 @media (max-width:760px){
   .stage{ flex-direction:column; }
   .side-panel{
     width:100%;
     flex-direction:row;
     justify-content:center;
     gap:16px;
   }
   .duo-wrap{ width:120px; height:120px; }
   .duo-char{ font-size:2.1rem; }
 }
</style>
</head>
<body>
<div id="app">
 <header>
   <h1>透過十格框比較數量</h1>
   <p>配對必須按格子順序進行：先點選上排第一格的圓點，再點選下排第一格的圓點，即完成第一次配對；然後依次點選第二格、第三格……不可跳格。當某一排的圓點全部配對完畢，另一排若有剩餘，同樣需依次點選，每點選一個，畫面右側的「較多」字就會變得更大。</p>
 </header>

 <div class="controls">
   <div class="field">
     <label for="topCount">上排數量</label>
     <input type="number" id="topCount" min="1" max="10" value="4" inputmode="numeric">
   </div>
   <div class="field">
     <label for="bottomCount">下排數量</label>
     <input type="number" id="bottomCount" min="1" max="10" value="7" inputmode="numeric">
   </div>
   <button id="startBtn">開始新一輪</button>
   <button id="randomBtn">隨機出題</button>
   <button id="muteBtn" aria-pressed="false">🔊 音效</button>
 </div>

 <div class="stage">
   <div class="frames" id="framesArea">
     <div class="frame-block" id="topBlock">
       <div class="frame-label">上排</div>
       <div class="tenframe" id="topFrame"></div>
     </div>
     <div class="status-bar" id="statusBar">請點選上排的一個圓點，開始配對。</div>
     <div class="frame-block" id="bottomBlock">
       <div class="frame-label">下排</div>
       <div class="tenframe" id="bottomFrame"></div>
     </div>
     <svg id="lineOverlay" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible;"></svg>
   </div>

   <div class="side-panel">
     <div class="duo-wrap">
       <span id="duoChar" class="duo-char">較多</span>
     </div>
     <div class="duo-count" id="duoCount"></div>
   </div>
 </div>

 <div class="result" id="resultPanel" hidden></div>
</div>

<script>
(function(){
 const topCountInput = document.getElementById('topCount');
 const bottomCountInput = document.getElementById('bottomCount');
 const startBtn = document.getElementById('startBtn');
 const randomBtn = document.getElementById('randomBtn');
 const muteBtn = document.getElementById('muteBtn');
 const topFrame = document.getElementById('topFrame');
 const bottomFrame = document.getElementById('bottomFrame');
 const topBlock = document.getElementById('topBlock');
 const bottomBlock = document.getElementById('bottomBlock');
 const statusBar = document.getElementById('statusBar');
 const duoChar = document.getElementById('duoChar');
 const duoCount = document.getElementById('duoCount');
 const resultPanel = document.getElementById('resultPanel');
 const framesArea = document.getElementById('framesArea');
 const lineOverlay = document.getElementById('lineOverlay');

 let topCount = 4, bottomCount = 7;
 let topDots = [];
 let bottomDots = [];
 let currentIndex = 0;      // which position (0-based) we're currently pairing
 let subState = 'needTop';  // needTop | needBottom
 let pairedCount = 0;
 let phase = 'pairing'; // pairing | leftover | done
 let leftoverSide = null;
 let leftoverDots = [];
 let nextLeftoverIndex = 0;
 let leftoverClicks = 0;
 let totalLeftover = 0;

 // ---- sound effects (Web Audio API, no external files) ----
 let soundOn = true;
 let audioCtx = null;
 function ensureAudioCtx(){
   if (!audioCtx){
     const Ctx = window.AudioContext || window.webkitAudioContext;
     if (!Ctx) return null;
     audioCtx = new Ctx();
   }
   if (audioCtx.state === 'suspended') audioCtx.resume();
   return audioCtx;
 }
 function playTone(freq, duration, waveType, volume){
   if (!soundOn) return;
   const ctx = ensureAudioCtx();
   if (!ctx) return;
   const osc = ctx.createOscillator();
   const gain = ctx.createGain();
   osc.type = waveType || 'sine';
   osc.frequency.setValueAtTime(freq, ctx.currentTime);
   gain.gain.setValueAtTime(0, ctx.currentTime);
   gain.gain.linearRampToValueAtTime(volume || 0.18, ctx.currentTime + 0.008);
   gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
   osc.connect(gain).connect(ctx.destination);
   osc.start();
   osc.stop(ctx.currentTime + duration + 0.02);
 }
 function playChime(freqs, gap){
   if (!soundOn) return;
   const ctx = ensureAudioCtx();
   if (!ctx) return;
   freqs.forEach(function(f, i){
     const t = ctx.currentTime + i * gap;
     const osc = ctx.createOscillator();
     const gain = ctx.createGain();
     osc.type = 'sine';
     osc.frequency.setValueAtTime(f, t);
     gain.gain.setValueAtTime(0, t);
     gain.gain.linearRampToValueAtTime(0.2, t + 0.008);
     gain.gain.exponentialRampToValueAtTime(0.0001, t + gap);
     osc.connect(gain).connect(ctx.destination);
     osc.start(t);
     osc.stop(t + gap + 0.02);
   });
 }
 function soundSelect(){ playTone(520, 0.11, 'sine', 0.16); }
 function soundPair(){ playChime([659, 880], 0.12); }
 function soundLeftover(n){ playTone(300 + Math.min(n, 8) * 55, 0.15, 'triangle', 0.2); }
 function soundInvalid(){ playTone(170, 0.14, 'sawtooth', 0.14); }
 function soundFinish(){ playChime([523, 659, 784], 0.15); }

 muteBtn.addEventListener('click', function(){
   soundOn = !soundOn;
   muteBtn.textContent = soundOn ? '🔊 音效' : '🔇 靜音';
   muteBtn.setAttribute('aria-pressed', String(!soundOn));
 });

 function clampCount(v){
   v = parseInt(v, 10);
   if (isNaN(v)) v = 1;
   return Math.max(1, Math.min(10, v));
 }

 function buildFrame(container, count, side){
   container.innerHTML = '';
   const dots = [];
   for (let i = 0; i < 10; i++){
     const cell = document.createElement('div');
     cell.className = 'cell';
     if (i < count){
       const dot = document.createElement('button');
       dot.type = 'button';
       dot.className = 'dot dot--' + side;
       dot.setAttribute('aria-label', (side === 'top' ? '上排' : '下排') + '第' + (i+1) + '個圓點');
       dot.addEventListener('click', function(){ handleDotClick(dot, side); });
       cell.appendChild(dot);
       dots.push(dot);
     }
     container.appendChild(cell);
   }
   return dots;
 }

 function updateStatus(text, warn){
   statusBar.textContent = text;
   statusBar.classList.toggle('warn', !!warn);
 }

 function pairingStatusText(){
   const n = currentIndex + 1;
   return subState === 'needTop'
     ? '請依次序點選：上排第 ' + n + ' 格的圓點。'
     : '請點選下排第 ' + n + ' 格的圓點，與上排配對。';
 }

 function shakeHint(clickedSide){
   soundInvalid();
   const wrongBlock = clickedSide === 'top' ? topBlock : bottomBlock;
   wrongBlock.classList.remove('shake');
   void wrongBlock.offsetWidth;
   wrongBlock.classList.add('shake');
   updateStatus('請依格子順序點選，不可跳格。', true);
   setTimeout(function(){
     if (phase === 'pairing'){
       updateStatus(pairingStatusText());
     } else if (phase === 'leftover'){
       updateStatusLeftover();
     }
   }, 1200);
 }

 function clearNextHighlights(){
   document.querySelectorAll('.dot.next').forEach(function(d){ d.classList.remove('next'); });
 }

 function updateHighlights(){
   clearNextHighlights();
   if (phase === 'pairing'){
     if (subState === 'needTop' && topDots[currentIndex]){
       topDots[currentIndex].classList.add('next');
     } else if (subState === 'needBottom' && bottomDots[currentIndex]){
       bottomDots[currentIndex].classList.add('next');
     }
   } else if (phase === 'leftover' && leftoverDots[nextLeftoverIndex]){
     leftoverDots[nextLeftoverIndex].classList.add('next');
   }
 }

 function drawPairLine(dotA, dotB){
   const areaRect = framesArea.getBoundingClientRect();
   const rA = dotA.getBoundingClientRect();
   const rB = dotB.getBoundingClientRect();
   const x1 = rA.left + rA.width/2 - areaRect.left;
   const y1 = rA.top + rA.height/2 - areaRect.top;
   const x2 = rB.left + rB.width/2 - areaRect.left;
   const y2 = rB.top + rB.height/2 - areaRect.top;
   const midY = (y1 + y2) / 2;
   const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
   path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' Q ' + ((x1+x2)/2) + ' ' + midY + ' ' + x2 + ' ' + y2);
   path.setAttribute('fill', 'none');
   path.setAttribute('stroke', '#8FAF7E');
   path.setAttribute('stroke-width', '3');
   path.setAttribute('stroke-linecap', 'round');
   const len = 260;
   path.style.strokeDasharray = len;
   path.style.strokeDashoffset = len;
   path.style.transition = 'stroke-dashoffset .5s ease';
   lineOverlay.appendChild(path);
   requestAnimationFrame(function(){ path.style.strokeDashoffset = '0'; });
   setTimeout(function(){
     path.style.transition = 'opacity .5s ease';
     path.style.opacity = '0';
     setTimeout(function(){ path.remove(); }, 520);
   }, 900);
 }

 function growDuo(){
   duoChar.classList.add('show');
   const scale = Math.min(1 + leftoverClicks * 0.55, 4.2);
   duoChar.style.transform = 'scale(' + scale + ')';
   const ratio = leftoverClicks / totalLeftover;
   duoChar.classList.remove('lvl2', 'lvl3');
   if (ratio > 0.66) duoChar.classList.add('lvl3');
   else if (ratio > 0.33) duoChar.classList.add('lvl2');
   duoChar.classList.remove('pop');
   void duoChar.offsetWidth;
   duoChar.classList.add('pop');

   const sideLabel = leftoverSide === 'top' ? '上排' : '下排';
   duoCount.textContent = sideLabel + '已點選 ' + leftoverClicks + ' 個，仍餘 ' + (totalLeftover - leftoverClicks) + ' 個未點選。';
 }

 function updateStatusLeftover(){
   const sideLabel = leftoverSide === 'top' ? '上排' : '下排';
   const remaining = totalLeftover - leftoverClicks;
   if (remaining > 0){
     const posInFrame = Math.min(topCount, bottomCount) + nextLeftoverIndex + 1;
     updateStatus(sideLabel + '尚有 ' + remaining + ' 個未完成配對，請依次點選第 ' + posInFrame + ' 格。');
   }
 }

 function finishGame(kind){
   phase = 'done';
   clearNextHighlights();
   soundFinish();
   resultPanel.hidden = false;
   if (kind === 'equal'){
     updateStatus('配對完成！');
     resultPanel.innerHTML = '上排與下排各有 <span class="big">' + topCount + '</span> 個，數量相等，全部配對完成！';
   } else {
     const sideLabel = leftoverSide === 'top' ? '上排' : '下排';
     const otherLabel = leftoverSide === 'top' ? '下排' : '上排';
     const thisCount = leftoverSide === 'top' ? topCount : bottomCount;
     const otherCount = leftoverSide === 'top' ? bottomCount : topCount;
     updateStatus('配對完成！');
     resultPanel.innerHTML = sideLabel + '有 ' + thisCount + ' 個，' + otherLabel + '有 ' + otherCount +
       ' 個。<br>' + sideLabel + '較多，多出 <span class="big">' + totalLeftover + '</span> 個。';
   }
 }

 function handleDotClick(dot, side){
   if (phase === 'done') return;

   if (phase === 'leftover'){
     if (side !== leftoverSide) return;
     if (dot !== leftoverDots[nextLeftoverIndex]){
       shakeHint(side);
       return;
     }
     dot.disabled = true;
     dot.classList.add('leftover');
     nextLeftoverIndex++;
     leftoverClicks++;
     soundLeftover(leftoverClicks);
     growDuo();
     updateHighlights();
     if (leftoverClicks === totalLeftover){
       finishGame('leftover');
     } else {
       updateStatusLeftover();
     }
     return;
   }

   // pairing phase — must proceed in exact position order, no skipping
   if (subState === 'needTop'){
     if (side !== 'top' || dot !== topDots[currentIndex]){
       shakeHint(side);
       return;
     }
     dot.disabled = true;
     dot.classList.add('selected');
     subState = 'needBottom';
     soundSelect();
     updateStatus(pairingStatusText());
     updateHighlights();
   } else {
     if (side !== 'bottom' || dot !== bottomDots[currentIndex]){
       shakeHint(side);
       return;
     }
     dot.disabled = true;
     const topDot = topDots[currentIndex];
     topDot.classList.remove('selected');
     topDot.classList.add('paired');
     dot.classList.add('paired');
     drawPairLine(topDot, dot);
     soundPair();
     pairedCount++;
     currentIndex++;
     subState = 'needTop';

     const minCount = Math.min(topCount, bottomCount);
     if (pairedCount === minCount){
       if (topCount === bottomCount){
         finishGame('equal');
       } else {
         phase = 'leftover';
         leftoverSide = topCount > bottomCount ? 'top' : 'bottom';
         leftoverDots = (leftoverSide === 'top' ? topDots : bottomDots).slice(minCount);
         nextLeftoverIndex = 0;
         totalLeftover = Math.abs(topCount - bottomCount);
         leftoverClicks = 0;
         updateStatusLeftover();
         updateHighlights();
       }
     } else {
       updateStatus(pairingStatusText());
       updateHighlights();
     }
   }
 }

 function resetGame(){
   topCount = clampCount(topCountInput.value);
   bottomCount = clampCount(bottomCountInput.value);
   topCountInput.value = topCount;
   bottomCountInput.value = bottomCount;

   lineOverlay.innerHTML = '';
   topDots = buildFrame(topFrame, topCount, 'top');
   bottomDots = buildFrame(bottomFrame, bottomCount, 'bottom');

   currentIndex = 0;
   subState = 'needTop';
   pairedCount = 0;
   phase = 'pairing';
   leftoverSide = null;
   leftoverDots = [];
   nextLeftoverIndex = 0;
   leftoverClicks = 0;
   totalLeftover = 0;

   duoChar.classList.remove('show', 'pop', 'lvl2', 'lvl3');
   duoChar.style.transform = 'scale(0)';
   duoCount.textContent = '';

   resultPanel.hidden = true;
   resultPanel.innerHTML = '';

   updateStatus(pairingStatusText());
   updateHighlights();
 }

 startBtn.addEventListener('click', resetGame);
 randomBtn.addEventListener('click', function(){
   topCountInput.value = 1 + Math.floor(Math.random() * 10);
   bottomCountInput.value = 1 + Math.floor(Math.random() * 10);
   resetGame();
 });

 resetGame();
})();
</script>
</body>
</html>
